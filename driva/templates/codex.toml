description = "Run the host's Codex binary interactively in Bubblewrap"
command = ["codex", "--sandbox", "danger-full-access"]
backend = "bwrap"
network = true
interactive = true

# The agent talks to a service over TLS, so the sandbox base has to be able
# to resolve a name and verify a certificate wherever it runs.
capability = ["dns", "certificates"]


[[mount]]
source = "~/.codex"
access = "write"

