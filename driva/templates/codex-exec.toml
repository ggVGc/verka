description = "Run OpenAI Codex non-interactively against the current project"
command = ["codex", "--sandbox", "danger-full-access", "exec", "--skip-git-repo-check"]
backend = "bwrap"
rootfs = "/"
network = true
interactive = false

# The agent talks to a service over TLS, so the sandbox base has to be able
# to resolve a name and verify a certificate wherever it runs.
capability = ["dns", "certificates"]

[environment]
HOME = "/root"
TERM = "xterm-256color"


[[mount]]
kind = "temporary"
destination = "~"

[[mount]]
kind = "temporary"
destination = "/root"

[[mount]]
source = "~/.codex/auth.json"
destination = "/root/.codex/auth.json"
access = "write"
