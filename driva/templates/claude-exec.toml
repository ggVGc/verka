description = "Run Claude Code non-interactively against the current project"
command = ["claude", "--dangerously-skip-permissions", "--print"]
path = ["~/.local/bin"]
backend = "bwrap"
network = true
interactive = false

# The agent talks to a service over TLS, so the sandbox base has to be able
# to resolve a name and verify a certificate wherever it runs.
capability = ["dns", "certificates"]

[environment]
DISABLE_AUTOUPDATER = "1"


[[mount]]
source = "~/.local/share"
access = "read"

[[mount]]
source = "~/.claude"
access = "write"

[[mount]]
source = "~/.claude.json"
access = "write"
