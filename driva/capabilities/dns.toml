description = "Turn a host name into an address, for a sandbox permitted a network"

# Permission to use the network is not the same as being able to find
# anything on it, and the difference is this capability. A sandbox that has
# `--network` but not these paths reaches every failure as "could not resolve
# host", far from the configuration that caused it.
#
# The hard part is that `/etc/resolv.conf` is where a host keeps a *pointer*,
# not always an answer. On a systemd host it is a symlink into
# `/run/systemd/resolve`, which the default `auto` mode follows rather than
# reproducing as a link to nothing; or it is a stub naming no nameserver at
# all, while `nsswitch.conf` sends the lookup to `nss_resolve` and a socket in
# that same directory. Both layouts are covered below, and a host that keeps
# its resolver somewhere else entirely is what `suggest` and the probe are for.

path = [
  # The nameservers, search domains, and options `getaddrinfo` reads when the
  # lookup reaches the `dns` source. Required: a host with no resolver
  # configuration at all is one where nothing here can work, and saying so at
  # launch is better than a name failing later.
  { at = "/etc/resolv.conf", doc = "The nameservers and search domains a DNS lookup uses" },

  # Which sources answer a host name, and in what order — `files`, `dns`,
  # `resolve`, `mymachines`. It is what sends a lookup to the resolver socket
  # rather than to `resolv.conf` on a systemd host, so a sandbox missing it
  # can have a perfectly good resolver directory and still fail. `identity`
  # carries the same path for the user and group databases.
  { at = "/etc/nsswitch.conf", optional = true, doc = "Which sources answer a host name, and in what order" },

  # Names the host answers without asking anyone: `localhost`, and whatever
  # else an operator has put there. Consulted by the `files` source before DNS.
  { at = "/etc/hosts", optional = true, doc = "Names answered locally, before any nameserver is asked" },

  # The other two name databases `getaddrinfo` and its neighbours read: port
  # numbers by service name, and protocol numbers by name. A program that asks
  # for "https" rather than 443 needs the first.
  { at = "/etc/services", optional = true, doc = "Port numbers by service name, for a program that asks for \"https\"" },
  { at = "/etc/protocols", optional = true, doc = "Protocol numbers by name, for sockets opened by protocol name" },

  # A systemd host's actual resolver: the `io.systemd.Resolve` socket that
  # `nss_resolve` talks to, and the real `resolv.conf` its stub points at.
  # Carrying the directory covers both, and covers the symlink above landing
  # somewhere real.
  { at = "/run/systemd/resolve", optional = true, doc = "The systemd-resolved socket and the resolver file its stub points at" },
]

# The only honest test: resolve a name from inside a sandbox built from this
# capability. Driva answers it as itself in the isolation, so the check needs
# nothing installed there.
probe = { resolve = "one.one.one.one" }

suggest = [
  "/run/systemd/resolve",
  "/run/NetworkManager",
  "/run/connman",
  "/run/resolvconf",
  "/run/dbus/system_bus_socket",
]
