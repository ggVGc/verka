[package]
name = "linka"
version.workspace = true
edition.workspace = true
description = "A git-versioned graph of LLM-development nodes: library and CLI"

[lib]
name = "linka"
path = "src/lib.rs"

[[bin]]
name = "linka"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
toml.workspace = true
ulid.workspace = true
