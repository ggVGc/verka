[workspace]
resolver = "2"
members = [
    "driva",
    "genta",
    "linka",
    "linka-cli",
    "linka-tui",
    "nota",
    "orka",
    "orka-tui",
    "orka-web",
    "styra/cli",
    "styra/protocol",
    "styra/server",
    "styra/transcription",
    "styra/ui",
    "styra/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
futures-util = "0.3"
hf-hub = "0.3"
hound = "3.5"
inotify = { version = "0.9", default-features = false }
libc = "0.2"
# The whisper.cpp bindings and decoder used by local transcription. GPU
# backends are selected by the transcription crate's features rather than
# here, so a plain workspace build remains portable and CPU-only.
whisper-rs = "0.16"
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "flac", "vorbis"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ratatui = "0.30"
pulldown-cmark = { version = "0.13", default-features = false }
tui-markdown = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
syn = { version = "2", features = ["full"] }
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
toml = "0.8"
ulid = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

driva = { path = "driva" }
genta = { path = "genta" }
linka = { path = "linka" }
linka-cli = { path = "linka-cli" }
linka-tui = { path = "linka-tui" }
orka = { path = "orka" }
nota = { path = "nota" }
server = { path = "styra/server" }
transcription = { path = "styra/transcription" }
protocol = { path = "styra/protocol" }
styra-ui = { path = "styra/ui" }

# Whisper inference is the only compute-bound work in the workspace. Keep its
# Rust wrapper optimized in a debug Styra build without obscuring the debug
# view of Styra's own code; its bundled C++ runtime is always a release build.
[profile.dev.package.whisper-rs]
opt-level = 3
