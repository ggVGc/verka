[package]
name = "protocol"
version.workspace = true
edition.workspace = true
description = "Serializable types for the styra-server JSON protocol"

[features]
# Generating client libraries for other languages (see `src/codegen`). On by
# default so the generated files are tested with the definitions they are
# generated from; a client that only wants the types can turn it off and drop
# the `syn` dependency.
default = ["codegen"]
codegen = ["dep:syn"]

[lib]
name = "styra_protocol"
path = "src/lib.rs"

[[bin]]
name = "styra-codegen"
path = "src/bin/styra-codegen.rs"
required-features = ["codegen"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
driva.workspace = true
genta.workspace = true
syn = { workspace = true, optional = true }
