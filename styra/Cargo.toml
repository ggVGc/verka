[package]
name = "styra"
version = "0.1.0"
edition = "2021"
description = "A terminal interface for interactive, isolated agent sessions"

[[bin]]
name = "styra"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde_json = "1"
styra-server = { path = "../styra-server" }
unicode-width = "0.2"
