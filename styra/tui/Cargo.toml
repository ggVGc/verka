[package]
name = "tui"
version.workspace = true
edition.workspace = true
description = "A terminal interface for interactive, isolated agent sessions"

[features]
default = ["renderer"]
renderer = ["styra-ui/renderer", "styra-diff/renderer"]
vulkan = ["server/vulkan"]
rocm = ["server/rocm"]

[lib]
name = "styra_tui"
path = "src/lib.rs"

[[bin]]
name = "styra"
path = "src/main.rs"
required-features = ["renderer"]
test = false

[dependencies]
anyhow.workspace = true
driva.workspace = true
base64.workspace = true
clap.workspace = true
cpal.workspace = true
hound.workspace = true
libc.workspace = true
pulldown-cmark.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
server.workspace = true
protocol.workspace = true
styra-diff.workspace = true
styra-ui.workspace = true
