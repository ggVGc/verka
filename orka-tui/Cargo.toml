[package]
name = "orka-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal control panel for an Orka workbench"

[[bin]]
name = "orka-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
linka = { path = "../linka" }
orka = { path = "../orka" }
ratatui = "0.29"
