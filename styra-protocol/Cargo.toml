[package]
name = "styra-protocol"
version.workspace = true
edition.workspace = true
description = "Serializable types for the styra-server JSON protocol"

[features]
# Generating the Lua client library (see `src/lua`). On by default so the
# generated file is tested with the definitions it is generated from; a client
# that only wants the types can turn it off and drop the `syn` dependency.
default = ["lua"]
lua = ["dep:syn"]

[[bin]]
name = "styra-protocol-lua"
path = "src/bin/styra-protocol-lua.rs"
required-features = ["lua"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
driva.workspace = true
genta.workspace = true
syn = { workspace = true, optional = true }
