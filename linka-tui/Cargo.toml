[package]
name = "linka-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal user interface for Linka"

[lib]
name = "linka_tui"
path = "src/lib.rs"

[[bin]]
name = "linka-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
linka = { path = "../linka" }
ratatui = "0.29"

